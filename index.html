<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Absences</title>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{--bg:#f4f7fc;--card:#fff;--ink:#14213d;--mut:#5b6a86;--line:#dde4f0;--pri:#1f5fe0;--pri2:#e6eeff;--warn:#fff3d6;--warnt:#8a5a00;--bad:#c92a2a;--badbg:#fdeaea;--ok:#e3f6ea;--okt:#17653a}
@media (prefers-color-scheme:dark){:root{--bg:#0f1626;--card:#172036;--ink:#e8edf8;--mut:#9aa8c4;--line:#2a3856;--pri:#6b9bff;--pri2:#1e2f57;--warn:#3a2e10;--warnt:#f2c46a;--bad:#ff8a8a;--badbg:#3b1c1f;--ok:#14301f;--okt:#7fd9a1;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Figtree,system-ui,sans-serif}
header{display:flex;align-items:center;gap:20px;flex-wrap:wrap;padding:12px 24px;background:var(--card);border-bottom:1px solid var(--line)}
.logo{font-weight:700;font-size:18px;color:var(--pri)}
nav{display:flex;gap:4px;flex:1}
nav button,.btn{font:inherit;border:0;border-radius:8px;padding:8px 14px;cursor:pointer;background:none;color:var(--mut);font-weight:500}
nav button.on{background:var(--pri2);color:var(--pri)}
.btn{background:var(--pri);color:#fff;font-weight:600}.btn.sec{background:var(--pri2);color:var(--pri)}.btn.bad{background:var(--badbg);color:var(--bad)}.btn.sm{padding:5px 10px}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
.badge{background:var(--bad);color:#fff;border-radius:10px;padding:0 7px;font-size:12px;margin-left:6px}
main{max-width:1100px;margin:0 auto;padding:24px 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px;margin-bottom:20px}
h2{margin:0 0 12px;font-size:20px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}@media(max-width:760px){.grid{grid-template-columns:1fr}}
label{display:block;font-weight:500;margin:10px 0 4px}
input,select{font:inherit;width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.bal{display:flex;gap:24px;flex-wrap:wrap}.bal b{display:block;font-size:26px;color:var(--pri)}.bal span{color:var(--mut);font-size:13px}
.chip{display:inline-block;padding:2px 10px;border-radius:12px;font-size:13px;font-weight:500}
.c-manager,.c-dirigeant,.c-annul{background:var(--warn);color:var(--warnt)}.c-ok{background:var(--ok);color:var(--okt)}.c-ko,.c-annulee{background:var(--badbg);color:var(--bad)}i.x{opacity:.5}td.mine{cursor:pointer}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line);flex-wrap:wrap}.row:first-of-type{border-top:0}
.note{padding:8px 12px;border-radius:8px;margin-top:10px;font-size:14px;background:var(--warn);color:var(--warnt)}.note.bad{background:var(--badbg);color:var(--bad)}
.mut{color:var(--mut);font-size:14px}
.wrap{overflow-x:auto}table{border-collapse:collapse;min-width:100%}
th,td{border:1px solid var(--line);text-align:center;font-size:12px;min-width:26px;height:34px;padding:0}
th{background:var(--bg);font-weight:500;color:var(--mut)}
th.n,td.n{position:sticky;left:0;background:var(--card);text-align:left;padding:0 12px;min-width:150px;font-size:14px;z-index:1}
.dim{background:var(--bg)}.r{background:var(--line)}
td.c{position:relative}td.c i{position:absolute;left:0;right:0;top:0;bottom:0}td.c i.m{bottom:50%}td.c i.a{top:50%}
.cp{--k:var(--pri)}.rp{--k:#f08c00}.hr{--k:#e64980}
i.ok{background:var(--k)}
i.p{background:repeating-linear-gradient(45deg,var(--k) 0 2px,transparent 2px 5px);box-shadow:inset 0 0 0 1px var(--k)}
th.al{background:var(--badbg);color:var(--bad);font-weight:700}
.leg{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--mut);margin-top:12px}.leg i{display:inline-block;width:14px;height:14px;vertical-align:-2px;margin-right:5px;border-radius:3px}
.login{max-width:380px;margin:12vh auto}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ============ CONFIGURATION : à remplir (Supabase > Project Settings > API) ============ */
const CFG={url:'https://gfoyhkdhuyhbwtyboyvj.supabase.co',key:'sb_publishable_lVQ8brecEn_9rU3qvf_R2A_VnEVOkyM'};
const MAILS={maxime:'maxime.coste@boisdarcy.leclerc',benedicte:'benedicte.canteux@boisdarcy.leclerc'};
/* ======================================================================================== */
const $=s=>document.querySelector(s),iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'),pd=s=>new Date(s+'T12:00:00'),addD=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function* rng(a,b){for(let d=pd(a);d<=pd(b);d=addD(d,1))yield new Date(d)}
const nd=(a,b)=>{let n=0;for(const d of rng(a,b))if(d.getDay())n++;return n}; // jours ouvrables : lundi au samedi
const fr=s=>pd(s).toLocaleDateString('fr-FR',{day:'numeric',month:'short'});
const T=new Date();
const ST={manager:'En attente du manager',dirigeant:'En attente du dirigeant',ok:'Validée',ko:'Refusée',annul:'Annulation demandée',annulee:'Annulée'};
const DAYS=['dim','lun','mar','mer','jeu','ven','sam'],RL={D:'dirigeant',M:'manager',E:'salarié'};
const TY={cp:'Congés payés',rp:'Repos',hr:"Demande d'horaires"},CPMAX=2,HF={m:'matin',a:'après-midi'};
const nm=(()=>{const d=addD(T,7);while(d.getDay()!==1)d.setDate(d.getDate()+1);return d})();
let F={type:'cp',a:iso(nm),c:iso(addD(nm,2)),h:'m'};
let sb=null,S={users:[],reqs:[]},me=null,view='plan',mo=0,msg='',ERR='',NOTE=null,SEL=[],FIRST=false,OKMSG='',ready=false,setup=false;
const U=id=>S.users.find(u=>u.id===id);
const live=r=>r.status!=='ko'&&r.status!=='annulee',pend=r=>r.status==='manager'||r.status==='dirigeant',ty=r=>r.type||'cp';
function acq(u){const s=pd(u.since);let m=(T.getFullYear()-s.getFullYear())*12+T.getMonth()-s.getMonth();if(T.getDate()<s.getDate())m--;return Math.max(0,2.5*m)}
function bal(u){const my=S.reqs.filter(r=>r.uid===u.id&&ty(r)==='cp');const taken=my.filter(r=>r.status==='ok'||r.status==='annul').reduce((s,r)=>s+nd(r.from,r.to),0),wait=my.filter(pend).reduce((s,r)=>s+nd(r.from,r.to),0),a=acq(u);return{rep:+u.rep,acq:a,taken,wait,left:+u.rep+a-taken-wait}}
function absent(date,exceptUid){return S.reqs.filter(r=>live(r)&&ty(r)!=='hr'&&r.uid!==exceptUid&&r.from<=date&&date<=r.to&&pd(date).getDay()).map(r=>U(r.uid)).filter(Boolean)}
function overlaps(uid,a,b){const o={};for(const d of rng(a,b)){const k=iso(d);absent(k,uid).forEach(u=>{(o[u.name]=o[u.name]||[]).push(k)})}return o}
const ovHTML=o=>Object.entries(o).map(([n,ds])=>`Chevauchement avec ${esc(n)} (${fr(ds[0])}${ds.length>1?' au '+fr(ds[ds.length-1]):''})`).join('<br>');
const fmt=r=>{const t=ty(r);return TY[t]+' · '+(t==='hr'?fr(r.from)+' ('+HF[r.half]+')':fr(r.from)+' → '+fr(r.to)+' · '+nd(r.from,r.to)+' j')};
function conflict(t,a,c,h){return S.reqs.some(r=>{if(r.uid!==me.id||!live(r))return false;if(ty(r)==='hr'&&t==='hr')return r.from===a&&r.half===h;return r.from<=c&&a<=r.to})}

/* ---------- Données (Supabase) ---------- */
async function load(){
  const [p,r]=await Promise.all([sb.from('profiles').select('*'),sb.from('requests').select('*')]);
  if(p.error||r.error)throw (p.error||r.error);
  const o={D:0,M:1,E:2};
  S.users=p.data.sort((a,b)=>o[a.role]-o[b.role]||a.name.localeCompare(b.name));
  S.reqs=r.data.map(x=>({id:x.id,uid:x.uid,type:x.type,from:x.from_date,to:x.to_date,half:x.half,status:x.status,by:x.by_role}));
}
async function act(q){ // exécute une écriture, recharge, réaffiche
  const {error}=await q;ERR=error?'Action refusée : '+error.message:'';
  try{await load()}catch(e){ERR='Chargement impossible : '+e.message}
  me=U(me.id)||me;render();
}
async function enter(id){
  await load();me=U(id)||null;
  if(!me){msg='Votre compte n’a pas encore de profil : contactez l’administrateur.';await sb.auth.signOut()}
}
function ref(){if(!me)return;me=U(me.id)||me;const a=document.activeElement;if(a&&a.closest&&a.closest('#m')&&/INPUT|SELECT/.test(a.tagName))return;render()}
async function init(){
  if(!window.supabase||CFG.url.includes('VOTRE')){setup=true;ready=true;render();return}
  sb=supabase.createClient(CFG.url,CFG.key);
  try{const {data}=await sb.auth.getSession();if(data.session)await enter(data.session.user.id)}catch(e){msg='Chargement impossible : '+e.message}
  ready=true;render();
  sb.channel('live').on('postgres_changes',{event:'*',schema:'public'},()=>{if(me)load().then(ref).catch(()=>{})}).subscribe();
}

/* ---------- Interface ---------- */
function mailBanner(){const r=NOTE,u=U(r.uid),n=u.name,to=u.role==='E'?(r.cancel?[MAILS.maxime]:[MAILS.maxime,MAILS.benedicte]):[MAILS.benedicte],s=encodeURIComponent((r.cancel?'Annulation – ':'')+TY[ty(r)]+' – '+n),b=encodeURIComponent('Bonjour,\n\n'+n+(r.cancel?' demande l’annulation de : ':' a fait une demande : ')+fmt(r)+'.\n\nMerci de la traiter dans l’application Absences.\n');
return`<div class="note" style="margin:12px 24px 0;background:var(--ok);color:var(--okt)">Demande envoyée. <a href="mailto:${to.join(',')}?subject=${s}&body=${b}" target="_blank" rel="noopener" style="color:inherit;font-weight:600">Prévenir par email</a> (${to.join(', ')}) <button class="btn sec sm" id="nx2" style="margin-left:8px">Fermer</button></div>`}
function toValidate(){return S.reqs.filter(r=>{const u=U(r.uid)||{};return (me.role==='M'&&(r.status==='manager'||(r.status==='annul'&&u.role==='E')))||(me.role==='D'&&(r.status==='dirigeant'||(r.status==='annul'&&u.role==='M')))})}
function render(){const A=$('#app');
if(!ready){A.innerHTML='<p class="mut" style="padding:24px">Chargement…</p>';return}
if(setup){A.innerHTML='<div class="login card"><h2>Configuration requise</h2><p>Ouvrez <b>index.html</b> et remplacez <code>CFG.url</code> et <code>CFG.key</code> par l’adresse et la clé publique de votre projet Supabase.</p></div>';return}
if(!me){A.innerHTML=`<div class="login card"><div class="logo">Absences</div><h2>Connexion</h2><label for="lu">Adresse email</label><input id="lu" type="email" autocomplete="username"><label for="lp">Mot de passe</label><input id="lp" type="password" autocomplete="current-password">${msg?`<div class="note bad">${esc(msg)}</div>`:''}<p><button class="btn" id="go">Se connecter</button></p></div>`;
const go=async()=>{const {data,error}=await sb.auth.signInWithPassword({email:$('#lu').value.trim(),password:$('#lp').value});
if(error){msg='Email ou mot de passe incorrect.';render();return}
msg='';FIRST=!(data.user.user_metadata&&data.user.user_metadata.pwd_changed);try{await enter(data.user.id)}catch(e){msg='Chargement impossible : '+e.message}view=me&&FIRST?'pwd':'plan';OKMSG='';render()};
$('#go').onclick=go;$('#lp').onkeydown=e=>{if(e.key==='Enter')go()};return}
const todo=toValidate().length;
A.innerHTML=`<header><span class="logo">Absences</span><nav><button data-v="plan" class="${view==='plan'?'on':''}">Planning</button><button data-v="mine" class="${view==='mine'?'on':''}">Mes demandes</button>${me.role!=='E'?`<button data-v="val" class="${view==='val'?'on':''}">À valider${todo?`<span class="badge">${todo}</span>`:''}</button>`:''}${me.role==='D'?`<button data-v="team" class="${view==='team'?'on':''}">Équipe</button>`:''}</nav><span class="mut">${esc(me.name)} (${RL[me.role]})</span><button class="btn sec sm" id="pw">Mot de passe</button><button class="btn sec sm" id="out">Quitter</button></header>${OKMSG?`<div class="note" style="margin:12px 24px 0;background:var(--ok);color:var(--okt)">${esc(OKMSG)}</div>`:''}${ERR?`<div class="note bad" style="margin:12px 24px 0">${esc(ERR)}</div>`:''}${NOTE?mailBanner():''}<main id="m"></main>`;
A.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{view=b.dataset.v;OKMSG='';render()});
$('#pw').onclick=()=>{view='pwd';OKMSG='';render()};
if($('#nx2'))$('#nx2').onclick=()=>{NOTE=null;render()};
$('#out').onclick=async()=>{await sb.auth.signOut();me=null;NOTE=null;msg='';render()};
({plan,mine,val,team,pwd:pwdView})[view]()}
function pwdView(){
$('#m').innerHTML=`<div class="card" style="max-width:480px">${FIRST?'<h2>Bienvenue '+esc(me.name.split(' ')[0])+' !</h2><p class="mut">C’est votre première connexion. Vous pouvez choisir dès maintenant un mot de passe personnel, à la place de celui qui vous a été communiqué.</p>':'<h2>Changer mon mot de passe</h2>'}<label for="p1">Nouveau mot de passe (8 caractères minimum)</label><input id="p1" type="password" autocomplete="new-password"><label for="p2">Confirmer le mot de passe</label><input id="p2" type="password" autocomplete="new-password"><div id="pm"></div><p><button class="btn" id="ps">Enregistrer</button> <button class="btn sec" id="pl">${FIRST?'Plus tard':'Annuler'}</button></p></div>`;
const m=t=>{$('#pm').innerHTML=`<div class="note bad">${esc(t)}</div>`};
$('#pl').onclick=()=>{FIRST=false;view='plan';render()};
$('#ps').onclick=async()=>{const a=$('#p1').value,b=$('#p2').value;
if(a.length<8)return m('Le mot de passe doit contenir au moins 8 caractères.');
if(a!==b)return m('Les deux mots de passe ne sont pas identiques.');
$('#ps').disabled=true;const {error}=await sb.auth.updateUser({password:a,data:{pwd_changed:true}});
if(error){$('#ps').disabled=false;return m('Modification impossible : '+error.message)}
FIRST=false;OKMSG='Votre mot de passe a bien été modifié.';view='plan';render()}}
function team(){const D=[[-1,'Aucun'],[1,'Lundi'],[2,'Mardi'],[3,'Mercredi'],[4,'Jeudi'],[5,'Vendredi'],[6,'Samedi'],[0,'Dimanche']];
$('#m').innerHTML=`<div class="card"><h2>Équipe</h2><p class="mut">Jour de repos fixe et solde de départ (en jours) de chaque personne.</p>${S.users.map(u=>`<div class="row"><b>${esc(u.name)} <span class="mut">(${RL[u.role]})</span></b><span><select style="width:auto" data-rest="${u.id}" aria-label="Jour de repos">${D.map(([v,l])=>`<option value="${v}"${+u.rest===v?' selected':''}>${l}</option>`).join('')}</select> <input type="number" step="0.5" min="0" style="width:90px" value="${u.rep}" data-rep="${u.id}" aria-label="Solde de départ"></span></div>`).join('')}</div>`;
document.querySelectorAll('[data-rest]').forEach(x=>x.onchange=()=>act(sb.from('profiles').update({rest:+x.value}).eq('id',x.dataset.rest)));
document.querySelectorAll('[data-rep]').forEach(x=>x.onchange=()=>act(sb.from('profiles').update({rep:+x.value||0}).eq('id',x.dataset.rep)))}
function cancelBtn(r){
if(r.status==='manager'||r.status==='dirigeant')return`<button class="btn bad sm" data-c="${r.id}">Annuler la demande</button>`;
if(r.status==='ok')return`<button class="btn bad sm" data-x="${r.id}">${me.role==='D'?'Annuler':'Demander l’annulation'}</button>`;
if(r.status==='annul')return`<span class="mut">En attente de décision (${me.role==='E'?'manager':'dirigeant'})</span>`;return''}
function panel(){const l=SEL.map(id=>S.reqs.find(r=>r.id===id)).filter(Boolean);if(!l.length)return'';
return`<div class="card"><h2>Ma demande</h2>${l.map(r=>`<div class="row"><span>${fmt(r)}<br><span class="chip c-${r.status}">${ST[r.status]}</span></span><span>${cancelBtn(r)}</span></div>`).join('')}<p><button class="btn sec sm" id="cl">Fermer</button></p></div>`}
function bindCancel(){
document.querySelectorAll('[data-c]').forEach(x=>x.onclick=()=>{SEL=[];act(sb.from('requests').delete().eq('id',x.dataset.c))});
document.querySelectorAll('[data-x]').forEach(x=>x.onclick=()=>{const r=S.reqs.find(q=>String(q.id)===x.dataset.x);if(me.role!=='D')NOTE=Object.assign({},r,{cancel:1});SEL=[];act(sb.from('requests').update({status:me.role==='D'?'annulee':'annul'}).eq('id',x.dataset.x))})}
function plan(){const first=new Date(T.getFullYear(),T.getMonth()+mo,1),n=new Date(first.getFullYear(),first.getMonth()+1,0).getDate(),ds=[...Array(n)].map((_,i)=>iso(new Date(first.getFullYear(),first.getMonth(),i+1)));
const head=ds.map(k=>{const c=absent(k).length,w=pd(k).getDay();return`<th class="${c>=2?'al':w?'':'dim'}" title="${c>=2?c+' absents ce jour':''}">${DAYS[w][0]}<br>${+k.slice(8)}</th>`}).join('');
const rows=S.users.map(u=>`<tr><td class="n">${esc(u.name)}</td>${ds.map(k=>{const w=pd(k).getDay(),rs=S.reqs.filter(r=>r.uid===u.id&&live(r)&&r.from<=k&&k<=r.to&&w);return`<td class="c ${w===+u.rest&&!rs.length?'r':w?'':'dim'}${rs.length&&u.id===me.id?' mine':''}" data-k="${k}">${rs.map(r=>`<i class="${ty(r)} ${r.status==='ok'||r.status==='annul'?'ok':'p'}${r.status==='annul'?' x':''}${ty(r)==='hr'?' '+r.half:''}"></i>`).join('')}</td>`}).join('')}</tr>`).join('');
$('#m').innerHTML=`<div class="card"><div class="row"><h2>${first.toLocaleDateString('fr-FR',{month:'long',year:'numeric'})}</h2><span><button class="btn sec sm" id="pv">‹</button> <button class="btn sec sm" id="td">Aujourd’hui</button> <button class="btn sec sm" id="nx">›</button></span></div><div class="wrap"><table><tr><th class="n"></th>${head}</tr>${rows}</table></div><div class="leg"><span><i class="cp ok"></i>Congés payés</span><span><i class="rp ok"></i>Repos</span><span><i class="hr ok"></i>Demande d'horaires (demi-journée)</span><span><i class="cp p"></i><i class="rp p"></i><i class="hr p"></i>Hachuré : en attente · plein : validé par le dirigeant</span><span><i class="r"></i>Jour de repos fixe</span><span><i style="background:var(--badbg);border:1px solid var(--bad)"></i>2 absents ou plus</span><span><i class="cp ok x"></i>Plus clair : annulation demandée</span></div></div>${panel()}`;
$('#pv').onclick=()=>{mo--;render()};$('#nx').onclick=()=>{mo++;render()};$('#td').onclick=()=>{mo=0;render()};
document.querySelectorAll('td.mine').forEach(td=>td.onclick=()=>{const k=td.dataset.k;SEL=S.reqs.filter(r=>r.uid===me.id&&live(r)&&r.from<=k&&k<=r.to&&pd(k).getDay()).map(r=>r.id);render()});
if($('#cl'))$('#cl').onclick=()=>{SEL=[];render()};bindCancel()}
function mine(){const b=bal(me),my=S.reqs.filter(r=>r.uid===me.id).sort((a,c)=>c.from.localeCompare(a.from));
$('#m').innerHTML=`<div class="grid"><div class="card"><h2>Mes soldes (jours ouvrables)</h2><div class="bal"><div><b>${b.left}</b><span>disponibles</span></div><div><b>${b.acq}</b><span>acquis depuis le démarrage (2,5 j/mois)</span></div><div><b>${b.rep}</b><span>solde de départ</span></div><div><b>${b.wait}</b><span>en attente</span></div></div></div>
<div class="card"><h2>Nouvelle demande</h2><label for="f0">Type de demande</label><select id="f0">${Object.entries(TY).map(([k,l])=>`<option value="${k}"${F.type===k?' selected':''}>${l}</option>`).join('')}</select><label for="f1">${F.type==='hr'?'Date':'Du'}</label><input type="date" id="f1" value="${F.a}">${F.type==='hr'?`<label for="f3">Demi-journée</label><select id="f3"><option value="m"${F.h==='m'?' selected':''}>Matin</option><option value="a"${F.h==='a'?' selected':''}>Après-midi</option></select>`:`<label for="f2">Au (inclus)</label><input type="date" id="f2" value="${F.c}">`}<div id="pv"></div><p><button class="btn" id="sb">Envoyer la demande</button></p></div></div>
<div class="card"><h2>Historique</h2>${my.length?my.map(r=>`<div class="row"><span>${fmt(r)}</span><span><span class="chip c-${r.status}">${ST[r.status]}</span> ${cancelBtn(r)}</span></div>`).join(''):'<p class="mut">Aucune demande pour le moment. Posez votre premier congé ci-dessus.</p>'}</div>`;
const pv=()=>{const t=F.type,a=F.a,c=t==='hr'?a:F.c;let h='',bad=0;const er=m=>{h+=`<div class="note bad">${m}</div>`;bad=1};
if(!a||!c||c<a)er('La date de fin doit suivre la date de début.');
else{const d=nd(a,c),o=t==='hr'?{}:overlaps(me.id,a,c),sd=pd(a).getDay(),ed=pd(c).getDay();
